# Pi-hole template - ModSecurity CRS false-positive tuning
#
# The Pi-hole web admin UI (/admin/) and REST API (/api/) legitimately send
# payloads that look hostile to the OWASP CRS: filesystem-like paths, regex
# blocklists, dnsmasq option strings, and HTML/JS-like values. The rules below
# relax whole CRS categories, but only for those two path prefixes, so the rest
# of the site keeps full protection. They are intentionally broad category-level
# removals - if you want tighter coverage, replace a ruleRemoveByTag with the
# specific ruleRemoveById values you observe in your ModSecurity audit log.

# /api/ - LFI rules (930xxx) flag the file-path-like list/group names and
# config keys the Pi-hole API accepts as parameters. Safe to relax here because
# the API never serves files from those values.
SecRule REQUEST_FILENAME "@beginsWith /api/" "id:1001,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-lfi"

# /api/ - RCE rules (932xxx) flag command- and shell-like tokens inside dnsmasq
# options and regex blocklists submitted through the API. These are stored as
# configuration, not executed by BunkerWeb, so the category is relaxed here.
SecRule REQUEST_FILENAME "@beginsWith /api/" "id:1002,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-rce"

# /api/ - rule 920420 rejects content types not on the CRS allow-list; the
# Pi-hole API exchanges JSON and other bodies that would otherwise be blocked.
SecRule REQUEST_FILENAME "@beginsWith /api/" "id:1004,phase:1,pass,nolog,ctl:ruleRemoveById=920420"

# /admin/ - LFI rules (930xxx) flag the log paths, adlist URLs, and query-DB
# parameters the admin UI passes around. Relaxed only for the admin prefix.
SecRule REQUEST_FILENAME "@beginsWith /admin/" "id:1005,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-lfi"

# /admin/ - XSS rules (941xxx) flag the regex filters, custom DNS entries, and
# domain strings with special characters submitted from the admin settings
# pages. Relaxed only for the admin prefix.
SecRule REQUEST_FILENAME "@beginsWith /admin/" "id:1006,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-xss"
