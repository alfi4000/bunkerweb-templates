# Tuwunel (Matrix homeserver) template - .well-known delegation
# Serves /.well-known/matrix/client and /.well-known/matrix/server so Matrix
# clients and federating servers can discover this homeserver.
#
# Replace every example.com below with your homeserver's public domain.
# The wildcard Access-Control-Allow-Origin is required by the Matrix .well-known
# spec so browser-based clients can read these files cross-origin.

location /.well-known/matrix/client {
    default_type application/json;
    add_header Access-Control-Allow-Origin *;
    return 200 '{"m.homeserver":{"base_url":"https://example.com"}}';
}

location /.well-known/matrix/server {
    default_type application/json;
    add_header Access-Control-Allow-Origin *;
    return 200 '{"m.server":"example.com:443"}';
}
