# WordPress admin-ajax false-positive exclusions (loaded after the CRS)

# Allow WordPress heartbeat and admin-ajax endpoints used by the dashboard
# 941130/942200: XSS/SQLi false positives from admin-ajax action payloads
# (XSS attribute vectors and MySQL comment/backtick-obfuscated SQLi signatures)
SecRule REQUEST_URI "@beginsWith /wp-admin/admin-ajax.php" \
    "id:10001,phase:1,pass,nolog,\
     ctl:ruleRemoveById=941130,\
     ctl:ruleRemoveById=942200"
# 942440/942450: SQL comment-sequence and hex-encoding false positives in admin-ajax POST bodies
SecRule REQUEST_URI "@beginsWith /wp-admin/admin-ajax.php" \
    "id:10002,phase:1,pass,nolog,\
     ctl:ruleRemoveById=942440,\
     ctl:ruleRemoveById=942450"

# XML-RPC intentionally keeps full CRS coverage. The only exclusion that would
# unblock pingbacks is 949110 (inbound anomaly-score blocking), and removing it
# disables anomaly scoring for the endpoint wholesale. Add a scoped exclusion
# downstream if you genuinely need XML-RPC.
