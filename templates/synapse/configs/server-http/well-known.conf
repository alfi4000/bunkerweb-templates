# Synapse (Matrix) template - .well-known delegation
# Serves the Matrix client and server discovery documents so clients and
# federating servers can locate this homeserver. Replace example.com
# with the hostname where Synapse is actually reachable.
location /.well-known/matrix/client {
    default_type application/json;
    # Wildcard CORS is required by the Matrix spec for client discovery.
    add_header Access-Control-Allow-Origin *;
    return 200 '{"m.homeserver":{"base_url":"https://example.com"}}';
}

location /.well-known/matrix/server {
    default_type application/json;
    # Wildcard CORS is required by the Matrix spec for server discovery.
    add_header Access-Control-Allow-Origin *;
    return 200 '{"m.server":"example.com:443"}';
}
